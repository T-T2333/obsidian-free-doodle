name: Release Obsidian Plugin

on:
  push:
    tags:
      - "**"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint main.ts

      - name: Build
        run: npm run build

      - name: Read plugin version
        id: version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag $tag does not match manifest version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Resolve release notes
        id: notes
        run: |
          file="release-notes/${{ steps.version.outputs.version }}.md"
          if [ -f "$file" ]; then
            echo "path=$file" >> "$GITHUB_OUTPUT"
            echo "Using release notes from $file"
          else
            echo "No release-notes/${{ steps.version.outputs.version }}.md found, will generate notes"
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
